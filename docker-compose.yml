version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sabujkuthi_app
    restart: always
    ports:
      # Map to host port (default: 3005). Change APP_PORT in your .env if 3005 is in use by another VPS app.
      - "${APP_PORT:-3005}:3000"
    volumes:
      # Persistent SQLite volume - preserves products, categories, orders and settings
      - ./data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=file:/data/dev.db
      - NODE_ENV=production
